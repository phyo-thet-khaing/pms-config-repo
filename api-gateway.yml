server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        # Product API
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/products/**

        # Category API
        - id: category-service
          uri: lb://product-service
          predicates:
            - Path=/api/categories/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info
