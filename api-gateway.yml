
server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          "[/**]":
            allowedOrigins:
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

      routes:
        # User Service - Auth, User, Role APIs
        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/auth/**,/api/users/**,/api/roles/**

        # Product API
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/products/**

        # Category API
        - id: category-service
          uri: lb://product-service
          predicates:
            - Path=/api/categories/**

        # Product Images
        - id: product-images
          uri: lb://product-service
          predicates:
            - Path=/uploads/products/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info
